<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gere paletas de cores aleatórias que combinam. Pressione espaço ou clique para gerar novas cores. Copie códigos HEX e RGB.">
    <title>Gerador de Paletas de Cores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <h1 class="title">Paletas de Cores</h1>
                <button class="generate-btn" id="generateBtn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6"></path>
                        <path d="M1 20v-6h6"></path>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
                    </svg>
                    Gerar
                </button>
            </div>
        </header>

        <!-- Main -->
        <main class="main">
            <!-- Color Palette -->
            <div class="palette-container">
                <div class="palette" id="palette">
                    <!-- As cores serão geradas aqui -->
                </div>
            </div>

            <!-- Hint -->
            <p class="hint">Clique em qualquer cor para copiar • Pressione <kbd>Espaço</kbd> para gerar</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
